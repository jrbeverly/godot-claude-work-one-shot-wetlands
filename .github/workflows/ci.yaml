name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Export Godot
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_mono_linux_x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_mono_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Linux/X11
          archive_output: true
          cache: true

      - name: Smoke test export
        run: |
          exe=$(find "${{ steps.export.outputs.build_directory }}" -name 'game.x86_64' | head -1)
          chmod +x "$exe"
          "$exe" --headless --quit-after 5 2>&1 | tee smoke.log
          grep -q "World: complete" smoke.log

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ${{ steps.export.outputs.archive_directory }}/*
